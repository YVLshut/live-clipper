name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer ffmpeg (avec flite pour la voix de test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Navigateur pour le test du garde-fou captcha
        run: python -m playwright install --with-deps chromium
      - name: Pytest
        env:
          HF_HUB_DISABLE_XET: "1"
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build interface
        working-directory: frontend
        run: npm ci && npm run build

  windows:
    name: Installeur Windows
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          else {
            $m = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build (interface + PyInstaller + ffmpeg/yt-dlp + Inno Setup)
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.version.outputs.version }}" -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: LiveClipper-Setup-${{ steps.version.outputs.version }}
          path: packaging/Output/LiveClipper-Setup.exe
          if-no-files-found: error
      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/LiveClipper-Setup.exe
          generate_release_notes: true
